services:

  web-ui:
    depends_on:
      - user-links
    build:
      context: .
      dockerfile: ./web-ui/Dockerfile
    container_name: web-ui
    networks:
      - front-end-net
    ports:
      - "127.0.0.1:8080:8080"

  user-links:
    depends_on:
      - user-links-db
    build:
      context: .
      dockerfile: ./user-links/Dockerfile
    container_name: user-links
    networks:
      - front-end-net
      - user-links-net
    ports:
# Opened ports for easier debug, strictly not allowed in production
      - "5001:5001"
    environment:
      - DB_PASSWORD=${LINK_SHARE_DB_PASSWORD:?database password not set}
      - ENV=development

  user-links-db:
    image: postgres:18.4
    container_name: user-links-db
    networks:
      - user-links-net
    ports:
# Opened ports for easier debug, strictly not allowed in production
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${LINK_SHARE_DB_PASSWORD:?database password not set}
    volumes:
      - ./user-links/init-db-dev:/docker-entrypoint-initdb.d
      - user-links-volume:/var/lib/postgresql

volumes:
  user-links-volume:

networks:
  front-end-net:
    driver: bridge
  user-links-net:
    driver: bridge
